name: CI - Security File Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-security-md:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify SECURITY.md exists
        run: |
          if (-Not (Test-Path "SECURITY.md")) {
            Write-Host "❌ SECURITY.md file is missing!"
            exit 1
          } else {
            Write-Host "✅ SECURITY.md found."
          }

      - name: Display SECURITY.md contents
        run: Get-Content SECURITY.md
