name: Canary Simulation

on:
  workflow_dispatch:
  pull_request:
    branches: [ main-structure ]

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Run Canary
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug
          cmake --build . -- -j$(nproc)
          ./build/simulate_packet_input --mode=canary --canary_pct=5 --episodes=5
